<div class="prac">
  <aside class="prac__menu">
    <a class="prac__marca" routerLink="/">🧠 <strong>Capstone</strong></a>

    <nav>
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: item.exacto }">
          <span>{{ item.icono }}</span> {{ item.etiqueta }}
        </a>
      }
    </nav>

    <div class="prac__usuario">
      <div>
        <strong>{{ auth.sesion()?.nombre }}</strong>
        <small>Practicante</small>
      </div>
      <button type="button" title="Cerrar sesión" (click)="auth.logout('/')">⎋</button>
    </div>
  </aside>

  <main class="prac__pagina">
    <router-outlet />
  </main>
</div>
