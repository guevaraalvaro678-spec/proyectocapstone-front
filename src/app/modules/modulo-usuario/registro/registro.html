<main class="registro">
  <a class="registro__marca" routerLink="/">
    <span class="registro__logo">🧠</span>
    <strong>Capstone<span>Psicología</span></strong>
  </a>

  <form class="registro__tarjeta" [formGroup]="form" (ngSubmit)="registrar()">
    <h1>Crea tu cuenta</h1>
    <p class="registro__intro">
      Regístrate para pedir orientación, agendar citas y seguir tu proceso desde un solo lugar.
    </p>

    <label>
      Nombre completo
      <input type="text" formControlName="nombre" autocomplete="name" />
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
        <small class="registro__aviso">Escribe tu nombre (mínimo 3 caracteres)</small>
      }
    </label>

    <label>
      Correo
      <input type="email" formControlName="correo" autocomplete="email" />
      @if (form.controls.correo.touched && form.controls.correo.invalid) {
        <small class="registro__aviso">Escribe un correo válido</small>
      }
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="registro__aviso">Mínimo 6 caracteres</small>
      }
    </label>

    <label>
      Confirmar contraseña
      <input type="password" formControlName="confirmar" autocomplete="new-password" />
      @if (form.controls.confirmar.touched && form.hasError('noCoinciden')) {
        <small class="registro__aviso">Las contraseñas no coinciden</small>
      }
    </label>

    <label class="registro__acepto">
      <input type="checkbox" formControlName="acepto" />
      <span>Acepto el tratamiento de mis datos personales</span>
    </label>
    @if (form.controls.acepto.touched && form.controls.acepto.invalid) {
      <small class="registro__aviso">Debes aceptar para continuar</small>
    }

    @if (error()) {
      <p class="registro__error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>

    <p class="registro__pie">
      ¿Ya tienes cuenta? <a routerLink="/login">Ingresar</a>
    </p>
  </form>
</main>
