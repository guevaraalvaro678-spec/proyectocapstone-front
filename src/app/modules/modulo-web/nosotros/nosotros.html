<section class="cabecera">
  <div class="cabecera__interior">
    <h1>Nosotros</h1>
    <p>{{ ong.nombre }}: jóvenes voluntarios y estudiantes que forman agentes de cambio.</p>
  </div>
</section>

<section class="bloque">
  <div class="bloque__interior">
    <div class="dos">
      <article class="panel">
        <h2>Nuestra misión</h2>
        <p>{{ ong.descripcion }}</p>
      </article>
      <article class="panel">
        <h2>Nuestro propósito</h2>
        <p>{{ ong.proposito }}</p>
      </article>
    </div>

    <h2 class="bloque__titulo">Lo que nos mueve</h2>
    <div class="valores">
      @for (valor of valores; track valor.titulo) {
        <article class="valor">
          <span>{{ valor.icono }}</span>
          <h3>{{ valor.titulo }}</h3>
          <p>{{ valor.texto }}</p>
        </article>
      }
    </div>
  </div>
</section>
