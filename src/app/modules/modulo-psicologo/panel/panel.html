<div class="admin">
  <aside class="admin__menu">
    <div class="admin__marca">
      <span class="admin__logo">🧠</span>
      <div>
        <strong>Capstone</strong>
        <small>Psicología</small>
      </div>
    </div>

    <nav class="admin__nav">
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo">
          <span class="admin__icono">{{ item.icono }}</span>
          {{ item.etiqueta }}
        </a>
      }
      <a routerLink="/">
        <span class="admin__icono">🌐</span>
        Sitio web
      </a>
    </nav>

    <div class="admin__usuario">
      <span class="admin__avatar">{{ inicial() }}</span>
      <div class="admin__datos">
        <strong>{{ auth.sesion()?.nombre }}</strong>
        <small>Psicólogo/a</small>
      </div>
      <button type="button" title="Cerrar sesión" (click)="auth.logout()">⎋</button>
    </div>
  </aside>

  <div class="admin__contenido">
    <header class="admin__cabecera">
      <div>
        <h1>Mi agenda</h1>
        <p>Tus citas, horarios y pacientes</p>
      </div>
      <span class="admin__fecha">{{ fecha }}</span>
    </header>

    <main class="admin__pagina">
      <router-outlet />
    </main>
  </div>
</div>
