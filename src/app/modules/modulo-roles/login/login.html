<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="ingresar()">
    <h1>Iniciar sesión</h1>

    <label>
      Usuario o correo
      <input type="text" formControlName="usuario" autocomplete="username" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <a class="login__volver" routerLink="/olvide-password">¿Olvidaste tu contraseña?</a>

    <p class="login__enlace">¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>

    <a class="login__volver" routerLink="/">← Volver al inicio</a>
  </form>
</main>
