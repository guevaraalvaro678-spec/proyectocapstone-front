<div class="acceso">
  <app-cabecera-publica />

  <main class="acceso__fondo">
    <div class="acceso__interior">
      <div class="acceso__texto">
        <h1>Bienvenido a <span>AMAAC Perú</span></h1>
        <p>Un espacio para participar y colaborar.</p>
        <span class="acceso__linea">Portal institucional de usuarios</span>
      </div>

      <section class="acceso__tarjeta">
        <h2>Inicia sesión</h2>
        <p>Accede a tu cuenta de AMAAC.</p>

        <form [formGroup]="form" (ngSubmit)="ingresar()">
          <label class="acceso__campo">
            Correo electrónico
            <span class="acceso__entrada">
              <span class="ico">mail</span>
              <input type="text" formControlName="usuario" autocomplete="username" placeholder="correo@ejemplo.com" />
            </span>
          </label>

          <label class="acceso__campo">
            Contraseña
            <span class="acceso__entrada">
              <span class="ico">lock</span>
              <input
                [type]="verClave() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña"
              />
              <button type="button" [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Ver contraseña'" (click)="verClave.set(!verClave())">
                <span class="ico">{{ verClave() ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </span>
          </label>

          <a class="acceso__olvido" routerLink="/olvide-password">¿Olvidaste tu contraseña?</a>

          @if (error()) {
            <p class="acceso__error">{{ error() }}</p>
          }

          <button type="submit" class="acceso__boton" [disabled]="cargando()">
            {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
          </button>

          @if (google.disponible()) {
            <span class="acceso__o">o</span>
            <div #botonGoogle class="acceso__google"></div>
          }
        </form>

        <p class="acceso__pie">¿No tienes una cuenta? <a routerLink="/registro">Crear cuenta</a></p>
      </section>
    </div>
  </main>
</div>
