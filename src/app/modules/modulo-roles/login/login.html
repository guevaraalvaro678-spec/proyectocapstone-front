<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="ingresar()">
    <h1>Iniciar sesión</h1>

    <label>
      Usuario
      <input type="text" formControlName="usuario" autocomplete="username" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</main>
